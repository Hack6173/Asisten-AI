[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asisten_ai"
version = "2.0.0"
description = "Sistem Asisten-AI Autonomous Intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=5.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "psutil>=5.9.0",
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "peft>=0.9.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["asisten_ai*"]
